[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-elbo"
version = "0.1.0"
description = "Exact finite and Gaussian Gauge-VFE experiment laboratories"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.0",
    "matplotlib>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-cov>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/multiagent_elbo"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]
